name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate plugin and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CTS plugin structure
        run: python3 scripts/validate-skills.py

      - name: Check .claude/skills mirror is in sync
        run: python3 scripts/sync-skills.py --check

      - name: Test scripts with coverage gate
        run: |
          pip install coverage
          coverage run --source=scripts --omit='scripts/build_*' -m unittest discover -s tests -v
          coverage report --fail-under=80

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint skill files
        run: markdownlint 'claude-team-skills/**/*.md' --config .markdownlint.json
